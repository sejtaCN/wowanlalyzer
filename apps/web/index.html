<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- 内联 SVG 图标：不额外发请求，静态托管与 file:// 都不会 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e13'/%3E%3Cpath d='M16 5c4.4 0 8 3.6 8 8v6c0 3.3-2.7 6-6 6h-4c-3.3 0-6-2.7-6-6v-6c0-4.4 3.6-8 8-8z' fill='%23f5c451'/%3E%3Ccircle cx='13' cy='14' r='2' fill='%230b0e13'/%3E%3Ccircle cx='19' cy='14' r='2' fill='%230b0e13'/%3E%3Cpath d='M13 20h6' stroke='%230b0e13' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>专精学习系统</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 这个 index.html 是 Vite 的开发入口：直接双击（file://）一定白屏，因为 /src/main.tsx 需要开发服务器。
      // 这里给一个中文提示页，避免把"白屏"误判成程序坏了。构建产物里没有这段逻辑（产物是内联脚本）。
      (function () {
        if (location.protocol !== 'file:') return;
        if (!document.querySelector('script[src*="/src/main.tsx"]')) return;
        var el = document.getElementById('root');
        if (!el) return;
        el.innerHTML =
          '<div style="font:16px/1.7 system-ui,\'Microsoft YaHei\',sans-serif;color:#f8fafc;background:#0b0e13;min-height:100vh;padding:48px 32px">' +
          '<h1 style="font-size:24px;margin:0 0 12px">这是开发入口，不是给你双击的文件</h1>' +
          '<p style="margin:0 0 8px">要看的界面在 <b>dist/index.html</b>：双击它，或者双击仓库根的 <b>打开系统.bat</b>。</p>' +
          '<p style="margin:0;color:#94a0af">这个目录下的 index.html 需要 Vite 开发服务器（npm run dev）才能渲染，双击一定是空白。</p>' +
          '</div>';
      })();
    </script>
  </body>
</html>
